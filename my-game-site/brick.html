<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brick Breaker - ফ্রি গেম জোন</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
    }

    .top-bar {
      width: 560px;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .back-btn {
      text-decoration: none;
      color: #f8fafc;
      background: #334155;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: #475569;
    }

    .scores-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .level-box {
      color: #38bdf8;
    }

    .lives-box {
      color: #f87171;
    }

    .score-box {
      color: #4ade80;
    }

    .high-score-box {
      color: #facc15;
    }

    canvas {
      background: #020617;
      border: 3px solid #a855f7;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
      touch-action: none;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .touch-controls {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
      touch-action: none;
    }

    .steer-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .steer-btn {
      height: 56px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 4px 0 #0b1120;
    }

    .steer-btn:active {
      transform: translateY(2px);
      background: #334155;
      border-color: #a855f7;
    }

    .util-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .util-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
    }

    .util-btn:active {
      background: #334155;
    }

    .bottom-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 560px;
    }

    .controls-info {
      color: #94a3b8;
      font-size: 0.84rem;
      text-align: center;
      line-height: 1.45;
    }

    .restart-btn {
      background: #a855f7;
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background: #c084fc;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← হোম পেজ</a>

    <div class="scores-wrapper">
      <div class="level-box">লেভেল: <span id="levelDisplay">1</span></div>
      <div class="lives-box">লাইফ: <span id="livesDisplay">3</span></div>
      <div class="score-box">স্কোর: <span id="score">0</span></div>
      <div class="high-score-box">সেরা: <span id="highScore">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="560" height="540"></canvas>

  <!-- ফোন ও টাচ কন্ট্রোল -->
  <div class="touch-controls" aria-label="Brick Breaker Touch Controls">
    <div class="steer-row">
      <button type="button" class="steer-btn" id="btnPadLeft">◀ বাম</button>
      <button type="button" class="steer-btn" id="btnPadRight">ডান ▶</button>
    </div>
    <div class="util-row">
      <button type="button" class="util-btn" id="btnBallSlow">গতি -</button>
      <button type="button" class="util-btn" id="btnBallFast">গতি +</button>
      <button type="button" class="util-btn" id="btnBrickPause">বিরতি (Space)</button>
    </div>
  </div>

  <div class="bottom-controls">
    <div class="controls-info">
      প্যাডেল: <b>Arrow Left/Right</b>, <b>A/D</b> বা <b>মাউস/টাচ</b> | গতি: <b>+ / -</b> | রিস্টার্ট: <b>Enter</b>
    </div>
    <button type="button" class="restart-btn" onclick="resetGame()">নতুন করে শুরু করুন (Enter)</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const livesDisplayEl = document.getElementById("livesDisplay");
    const levelDisplayEl = document.getElementById("levelDisplay");

    let score = 0;
    let highScore = parseInt(localStorage.getItem("brickBreakerHighScore") || "0", 10);
    let lives = 3;
    let level = 1;
    let isGameOver = false;
    let isPaused = false;
    let animationId;

    highScoreEl.textContent = highScore;

    const paddle = {
      width: 105,
      height: 14,
      x: (canvas.width - 105) / 2,
      y: canvas.height - 28,
      speed: 8
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 44,
      radius: 9,
      speed: 4.5,
      dx: 4.5,
      dy: -4.5
    };

    const brickConfig = {
      rowCount: 5,
      columnCount: 8,
      width: 58,
      height: 20,
      padding: 8,
      offsetTop: 50,
      offsetLeft: 20
    };

    const rowColors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#38bdf8"];
    let bricks = [];

    const keys = {
      left: false,
      right: false
    };

    function createBricks() {
      bricks = [];
      const rows = Math.min(7, 4 + level);
      brickConfig.rowCount = rows;

      for (let c = 0; c < brickConfig.columnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < rows; r++) {
          const brickX = c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft;
          const brickY = r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop;
          // লেভেল ২ থেকে উপরের সারির ব্লক ভাঙতে ২ বার আঘাত লাগবে
          const hitsNeeded = (level >= 2 && r === 0) ? 2 : 1;
          bricks[c][r] = {
            x: brickX,
            y: brickY,
            status: hitsNeeded,
            maxHits: hitsNeeded
          };
        }
      }
    }

    function resetBallAndPaddle() {
      paddle.x = (canvas.width - paddle.width) / 2;
      ball.x = canvas.width / 2;
      ball.y = paddle.y - ball.radius - 2;
      const angle = (Math.random() * 0.6 - 0.3);
      ball.dx = ball.speed * Math.sin(angle + 0.45);
      ball.dy = -Math.abs(ball.speed * Math.cos(angle));
    }

    function initGame() {
      score = 0;
      lives = 3;
      level = 1;
      ball.speed = 4.5;
      isGameOver = false;
      isPaused = false;

      updateHUD();
      createBricks();
      resetBallAndPaddle();

      if (animationId) cancelAnimationFrame(animationId);
      gameLoop();
    }

    function resetGame() {
      initGame();
    }

    function updateHUD() {
      scoreEl.textContent = score;
      livesDisplayEl.textContent = lives;
      levelDisplayEl.textContent = level;
    }

    function changeBallSpeed(delta) {
      const newSpeed = Math.max(3, Math.min(8.5, +(ball.speed + delta).toFixed(1)));
      const ratio = newSpeed / ball.speed;
      ball.speed = newSpeed;
      ball.dx *= ratio;
      ball.dy *= ratio;
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Paused (বিরতি)", canvas.width / 2, canvas.height / 2);
      } else {
        gameLoop();
      }
    }

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem("brickBreakerHighScore", highScore);
      }
    }

    function collisionDetection() {
      let activeBricks = 0;

      for (let c = 0; c < brickConfig.columnCount; c++) {
        for (let r = 0; r < brickConfig.rowCount; r++) {
          const b = bricks[c][r];
          if (b.status > 0) {
            activeBricks++;
            if (
              ball.x + ball.radius > b.x &&
              ball.x - ball.radius < b.x + brickConfig.width &&
              ball.y + ball.radius > b.y &&
              ball.y - ball.radius < b.y + brickConfig.height
            ) {
              ball.dy = -ball.dy;
              b.status--;
              if (b.status === 0) {
                activeBricks--;
                score += 10;
              } else {
                score += 5;
              }
              updateHUD();
              updateHighScore();
            }
          }
        }
      }

      // সব ব্লক ভেঙে গেলে পরবর্তী লেভেল
      if (activeBricks === 0) {
        level++;
        ball.speed = Math.min(8, ball.speed + 0.4);
        updateHUD();
        createBricks();
        resetBallAndPaddle();
      }
    }

    function update() {
      if (keys.left && paddle.x > 6) {
        paddle.x -= paddle.speed;
      }
      if (keys.right && paddle.x + paddle.width < canvas.width - 6) {
        paddle.x += paddle.speed;
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      // ডান ও বাম দেয়ালে বাউন্স
      if (ball.x + ball.radius > canvas.width) {
        ball.x = canvas.width - ball.radius;
        ball.dx = -Math.abs(ball.dx);
      } else if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.dx = Math.abs(ball.dx);
      }

      // উপরের দেয়ালে বাউন্স
      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.dy = Math.abs(ball.dy);
      }

      // প্যাডেলে লাগলে বাউন্স (প্যাডেলের কোন অংশে লাগছে তার ওপর কোণ নির্ভর করবে)
      if (
        ball.dy > 0 &&
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x >= paddle.x - 4 &&
        ball.x <= paddle.x + paddle.width + 4
      ) {
        const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        const maxBounceAngle = Math.PI / 3;
        const bounceAngle = hitPoint * maxBounceAngle;

        ball.dx = ball.speed * Math.sin(bounceAngle);
        ball.dy = -Math.abs(ball.speed * Math.cos(bounceAngle));
        ball.y = paddle.y - ball.radius;
      }

      // নিচে পড়ে গেলে লাইফ কমবে
      if (ball.y - ball.radius > canvas.height) {
        lives--;
        updateHUD();
        if (lives <= 0) {
          triggerGameOver();
          return;
        } else {
          resetBallAndPaddle();
        }
      }

      collisionDetection();
    }

    function drawBricks() {
      for (let c = 0; c < brickConfig.columnCount; c++) {
        for (let r = 0; r < brickConfig.rowCount; r++) {
          const b = bricks[c][r];
          if (b.status > 0) {
            ctx.fillStyle = b.status === 2 ? "#e2e8f0" : rowColors[r % rowColors.length];
            ctx.beginPath();
            ctx.roundRect(b.x, b.y, brickConfig.width, brickConfig.height, 5);
            ctx.fill();

            if (b.status === 2) {
              ctx.strokeStyle = "#a855f7";
              ctx.lineWidth = 2;
              ctx.stroke();
            }
          }
        }
      }
    }

    function drawPaddle() {
      ctx.fillStyle = "#a855f7";
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
      ctx.fill();

      ctx.fillStyle = "#e9d5ff";
      ctx.fillRect(paddle.x + 12, paddle.y + 3, paddle.width - 24, 3);
    }

    function drawBall() {
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fef9c3";
      ctx.beginPath();
      ctx.arc(ball.x - 3, ball.y - 3, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawBricks();
      drawPaddle();
      drawBall();
    }

    function triggerGameOver() {
      isGameOver = true;
      cancelAnimationFrame(animationId);

      ctx.fillStyle = "rgba(2, 6, 23, 0.86)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#f87171";
      ctx.font = "bold 38px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 28);

      ctx.fillStyle = "#f8fafc";
      ctx.font = "20px sans-serif";
      ctx.fillText("আপনার স্কোর: " + score, canvas.width / 2, canvas.height / 2 + 12);

      ctx.fillStyle = "#c084fc";
      ctx.font = "bold 17px sans-serif";
      ctx.fillText("Enter বা বাটন চাপুন — আবার খেলতে", canvas.width / 2, canvas.height / 2 + 52);
    }

    function gameLoop() {
      if (isGameOver || isPaused) return;
      update();
      if (!isGameOver) {
        draw();
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    // টাচ বাটন হ্যান্ডলিং
    function bindHoldButton(id, keyName) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        keys[keyName] = true;
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach((evt) => {
        btn.addEventListener(evt, () => {
          keys[keyName] = false;
        });
      });
    }

    bindHoldButton("btnPadLeft", "left");
    bindHoldButton("btnPadRight", "right");

    document.getElementById("btnBallSlow")?.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      changeBallSpeed(-0.5);
    });
    document.getElementById("btnBallFast")?.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      changeBallSpeed(0.5);
    });
    document.getElementById("btnBrickPause")?.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      togglePause();
    });

    // মাউস ও ক্যানভাস টাচ দিয়ে সরাসরি প্যাডেল সরানো
    function movePaddleToClientX(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const relativeX = (clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relativeX - paddle.width / 2));
    }

    canvas.addEventListener("mousemove", (e) => {
      if (!isGameOver && !isPaused) {
        movePaddleToClientX(e.clientX);
      }
    });

    canvas.addEventListener("touchmove", (e) => {
      if (!isGameOver && !isPaused && e.touches.length > 0) {
        movePaddleToClientX(e.touches[0].clientX);
      }
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if (["arrowleft", "arrowright", " ", "enter"].includes(key)) {
        e.preventDefault();
      }

      if (key === "enter" && isGameOver) {
        resetGame();
        return;
      }

      if (key === " ") {
        togglePause();
        return;
      }

      if (key === "arrowleft" || key === "a") keys.left = true;
      if (key === "arrowright" || key === "d") keys.right = true;

      if (key === "+" || key === "=") changeBallSpeed(0.5);
      else if (key === "-" || key === "_") changeBallSpeed(-0.5);
    });

    document.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      if (key === "arrowleft" || key === "a") keys.left = false;
      if (key === "arrowright" || key === "d") keys.right = false;
    });

    initGame();
  </script>

</body>
</html>
