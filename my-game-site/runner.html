<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Subway Runner - ফ্রি গেম জোন</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
    }

    .top-bar {
      width: 460px;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .back-btn {
      text-decoration: none;
      color: #f8fafc;
      background: #334155;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: #475569;
    }

    .scores-wrapper {
      display: flex;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .speed-box {
      color: #38bdf8;
    }

    .score-box {
      color: #4ade80;
    }

    .high-score-box {
      color: #facc15;
    }

    canvas {
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
      touch-action: none;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .touch-controls {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
      touch-action: none;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .touch-btn {
      height: 54px;
      border-radius: 11px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 4px 0 #0b1120;
    }

    .touch-btn:active {
      transform: translateY(2px);
      background: #334155;
      border-color: #38bdf8;
    }

    .util-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .util-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
    }

    .util-btn:active {
      background: #334155;
    }

    .bottom-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 460px;
    }

    .controls-info {
      color: #94a3b8;
      font-size: 0.84rem;
      text-align: center;
      line-height: 1.45;
    }

    .restart-btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← হোম পেজ</a>

    <div class="scores-wrapper">
      <div class="speed-box">গতি: <span id="speedDisplay">1.0x</span></div>
      <div class="score-box">স্কোর: <span id="score">0</span></div>
      <div class="high-score-box">সেরা: <span id="highScore">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="460" height="600"></canvas>

  <!-- ফোন ও টাচ কন্ট্রোল -->
  <div class="touch-controls" aria-label="Runner Touch Controls">
    <div class="action-grid">
      <button type="button" class="touch-btn" id="btnLeft">◀ বাম</button>
      <button type="button" class="touch-btn" id="btnJump">▲ লাফ</button>
      <button type="button" class="touch-btn" id="btnDuck">▼ ডুব</button>
      <button type="button" class="touch-btn" id="btnRight">ডান ▶</button>
    </div>
    <div class="util-row">
      <button type="button" class="util-btn" id="btnSpeedDown">গতি -</button>
      <button type="button" class="util-btn" id="btnSpeedUp">গতি +</button>
      <button type="button" class="util-btn" id="btnPause">বিরতি</button>
    </div>
  </div>

  <div class="bottom-controls">
    <div class="controls-info">
      লেন: <b>Left/Right</b> বা <b>A/D</b> | লাফ: <b>Up/W/Space</b> | ডুব: <b>Down/S</b> | রিস্টার্ট: <b>Enter</b>
    </div>
    <button type="button" class="restart-btn" onclick="resetGame()">নতুন করে শুরু করুন (Enter)</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const speedDisplayEl = document.getElementById("speedDisplay");

    const trackMargin = 42;
    const trackWidth = canvas.width - trackMargin * 2;
    const laneCount = 3;
    const laneWidth = trackWidth / laneCount;
    const baseGroundY = canvas.height - 90;

    let player;
    let obstacles = [];
    let coins = [];
    let sleeperOffsets = [];
    let score = 0;
    let highScore = parseInt(localStorage.getItem("subwayRunnerHighScore") || "0", 10);
    let baseSpeed = 5.5;
    let speedMultiplier = 1.0;
    let isGameOver = false;
    let isPaused = false;
    let animationId;
    let frameCount = 0;

    highScoreEl.textContent = highScore;

    function getLaneCenter(laneIndex) {
      return trackMargin + laneIndex * laneWidth + laneWidth / 2;
    }

    function initGame() {
      player = {
        lane: 1,
        x: getLaneCenter(1),
        groundY: baseGroundY,
        y: baseGroundY,
        width: 36,
        normalHeight: 52,
        duckHeight: 28,
        vy: 0,
        gravity: 0.72,
        jumpForce: -13.8,
        isJumping: false,
        duckTimer: 0
      };

      obstacles = [];
      coins = [];
      sleeperOffsets = [];
      for (let y = 0; y < canvas.height + 60; y += 50) {
        sleeperOffsets.push(y);
      }

      score = 0;
      baseSpeed = 5.5;
      speedMultiplier = 1.0;
      isGameOver = false;
      isPaused = false;
      frameCount = 0;

      scoreEl.textContent = score;
      updateSpeedLabel();

      if (animationId) cancelAnimationFrame(animationId);
      gameLoop();
    }

    function updateSpeedLabel() {
      speedDisplayEl.textContent = speedMultiplier.toFixed(1) + "x";
    }

    function changeSpeed(delta) {
      speedMultiplier = Math.max(0.7, Math.min(2.4, +(speedMultiplier + delta).toFixed(1)));
      updateSpeedLabel();
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.68)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Paused (বিরতি)", canvas.width / 2, canvas.height / 2);
      } else {
        gameLoop();
      }
    }

    function resetGame() {
      initGame();
    }

    function moveLane(dir) {
      if (isGameOver || isPaused) return;
      player.lane = Math.max(0, Math.min(laneCount - 1, player.lane + dir));
    }

    function jumpPlayer() {
      if (isGameOver || isPaused) return;
      if (!player.isJumping) {
        player.vy = player.jumpForce;
        player.isJumping = true;
        player.duckTimer = 0;
      }
    }

    function duckPlayer() {
      if (isGameOver || isPaused) return;
      if (player.isJumping) {
        player.vy = Math.max(player.vy + 7, 9);
      }
      player.duckTimer = 28;
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * laneCount);

      // নতুন বাধা তৈরির আগে যথেষ্ট ফাঁকা জায়গা আছে কি না তা দেখা
      for (let obs of obstacles) {
        if (obs.y < 190) return;
      }

      const roll = Math.random();

      if (roll < 0.45) {
        // সামনে থেকে আসা বড় রেলগাড়ি (Train) — লেন বদলে বাঁচতে হবে
        const trainW = 68;
        const trainLen = 145 + Math.floor(Math.random() * 55);
        const trainColors = ["#dc2626", "#2563eb", "#059669", "#7c3aed"];
        const chosenColor = trainColors[Math.floor(Math.random() * trainColors.length)];

        obstacles.push({
          lane: lane,
          x: getLaneCenter(lane) - trainW / 2,
          y: -20,
          width: trainW,
          length: trainLen,
          extraSpeed: 2.2, // ট্রেন নিজের গতিতে সামনে থেকে দ্রুত এগিয়ে আসবে
          type: "train",
          color: chosenColor
        });
      } else if (roll < 0.78) {
        // নিচের ব্যারিকেড — লাফ দিয়ে পার হতে হবে
        const obsWidth = 54;
        obstacles.push({
          lane: lane,
          x: getLaneCenter(lane) - obsWidth / 2,
          y: -30,
          width: obsWidth,
          height: 28,
          extraSpeed: 0,
          type: "low",
          color: "#ef4444"
        });
      } else {
        // উপরের ঝুলন্ত বাধা — ডুব দিয়ে নিচ দিয়ে যেতে হবে
        const obsWidth = 58;
        obstacles.push({
          lane: lane,
          x: getLaneCenter(lane) - obsWidth / 2,
          y: -30,
          width: obsWidth,
          height: 22,
          extraSpeed: 0,
          type: "high",
          color: "#f97316"
        });
      }
    }

    function spawnCoins() {
      const lane = Math.floor(Math.random() * laneCount);
      const cx = getLaneCenter(lane);

      for (let obs of obstacles) {
        if (obs.lane === lane && obs.y < 140) return;
      }

      // একসাথে ৩টি কয়েনের সারি
      for (let i = 0; i < 3; i++) {
        coins.push({
          x: cx,
          y: -25 - i * 38,
          radius: 10
        });
      }
    }

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem("subwayRunnerHighScore", highScore);
      }
    }

    function getPlayerHitbox() {
      const isDucking = !player.isJumping && player.duckTimer > 0;
      const h = isDucking ? player.duckHeight : player.normalHeight;
      const w = player.width - 10;
      const hx = player.x - w / 2;
      const hy = player.y - h;
      return { x: hx, y: hy, width: w, height: h, isDucking };
    }

    function getObstacleHitbox(obs) {
      if (obs.type === "train") {
        // ট্রেন অনেক উঁচু, তাই লাফ দিয়েও এর ওপর ওঠা যাবে না — লেন বদলাতে হবে
        return {
          x: obs.x + 6,
          y: obs.y - obs.length,
          width: obs.width - 12,
          height: obs.length
        };
      } else if (obs.type === "low") {
        return {
          x: obs.x + 5,
          y: obs.y - obs.height,
          width: obs.width - 10,
          height: obs.height
        };
      } else {
        return {
          x: obs.x + 5,
          y: obs.y - 54,
          width: obs.width - 10,
          height: 24
        };
      }
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function update() {
      frameCount++;
      const currentSpeed = (baseSpeed + Math.floor(score / 220) * 0.45) * speedMultiplier;

      const targetX = getLaneCenter(player.lane);
      player.x += (targetX - player.x) * 0.28;

      if (player.isJumping) {
        player.y += player.vy;
        player.vy += player.gravity;
        if (player.y >= player.groundY) {
          player.y = player.groundY;
          player.vy = 0;
          player.isJumping = false;
        }
      }

      if (player.duckTimer > 0) {
        player.duckTimer--;
      }

      for (let i = 0; i < sleeperOffsets.length; i++) {
        sleeperOffsets[i] += currentSpeed;
        if (sleeperOffsets[i] > canvas.height) {
          sleeperOffsets[i] = -50;
        }
      }

      const spawnGap = Math.max(46, Math.floor(92 / speedMultiplier));
      if (frameCount % spawnGap === 0) {
        spawnObstacle();
      }
      if (frameCount % 85 === 0) {
        spawnCoins();
      }

      const pBox = getPlayerHitbox();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += currentSpeed + (obs.extraSpeed || 0);
        const oBox = getObstacleHitbox(obs);

        if (rectsOverlap(pBox, oBox)) {
          triggerGameOver();
          return;
        }

        const bottomEdge = obs.type === "train" ? obs.y - obs.length : obs.y - 60;
        if (bottomEdge > canvas.height + 20) {
          obstacles.splice(i, 1);
          score += obs.type === "train" ? 15 : 10;
          scoreEl.textContent = score;
          updateHighScore();
        }
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        coins[i].y += currentSpeed;
        const cBox = {
          x: coins[i].x - coins[i].radius,
          y: coins[i].y - coins[i].radius - 16,
          width: coins[i].radius * 2,
          height: coins[i].radius * 2
        };

        if (rectsOverlap(pBox, cBox)) {
          coins.splice(i, 1);
          score += 15;
          scoreEl.textContent = score;
          updateHighScore();
          continue;
        }

        if (coins[i].y > canvas.height + 30) {
          coins.splice(i, 1);
        }
      }
    }

    function drawTrack() {
      ctx.fillStyle = "#064e3b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(trackMargin, 0, trackWidth, canvas.height);

      ctx.fillStyle = "#334155";
      for (let y of sleeperOffsets) {
        ctx.fillRect(trackMargin + 6, y, trackWidth - 12, 8);
      }

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 3;
      for (let l = 0; l < laneCount; l++) {
        const lx = getLaneCenter(l);
        ctx.beginPath();
        ctx.moveTo(lx - 18, 0);
        ctx.lineTo(lx - 18, canvas.height);
        ctx.moveTo(lx + 18, 0);
        ctx.lineTo(lx + 18, canvas.height);
        ctx.stroke();
      }
    }

    function drawTrain(obs) {
      const topY = obs.y - obs.length;
      const w = obs.width;
      const len = obs.length;

      // ট্রেনের মূল বডি
      ctx.fillStyle = obs.color;
      ctx.beginPath();
      ctx.roundRect(obs.x, topY, w, len, 10);
      ctx.fill();

      // ছাদের অংশ (হালকা শেড)
      ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
      ctx.beginPath();
      ctx.roundRect(obs.x + 8, topY + 6, w - 16, len - 28, 6);
      ctx.fill();

      // দুই পাশের জানালা
      ctx.fillStyle = "#0f172a";
      for (let wy = topY + 14; wy < obs.y - 38; wy += 24) {
        ctx.fillRect(obs.x + 4, wy, 5, 14);
        ctx.fillRect(obs.x + w - 9, wy, 5, 14);
      }

      // সামনের উইন্ডশিল্ড (কাঁচ)
      ctx.fillStyle = "#bae6fd";
      ctx.beginPath();
      ctx.roundRect(obs.x + 10, obs.y - 24, w - 20, 14, 4);
      ctx.fill();

      // সামনের দুই হেডলাইট ও আলোর আভা
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(obs.x + 15, obs.y - 5, 4.5, 0, Math.PI * 2);
      ctx.arc(obs.x + w - 15, obs.y - 5, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // হেডলাইটের আলো সামনে ছড়িয়ে পড়া
      const grad = ctx.createLinearGradient(0, obs.y, 0, obs.y + 42);
      grad.addColorStop(0, "rgba(254, 240, 138, 0.35)");
      grad.addColorStop(1, "rgba(254, 240, 138, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(obs.x + 8, obs.y);
      ctx.lineTo(obs.x + w - 8, obs.y);
      ctx.lineTo(obs.x + w + 6, obs.y + 42);
      ctx.lineTo(obs.x - 6, obs.y + 42);
      ctx.closePath();
      ctx.fill();
    }

    function drawObstacles() {
      for (let obs of obstacles) {
        if (obs.type === "train") {
          drawTrain(obs);
        } else if (obs.type === "low") {
          ctx.fillStyle = obs.color;
          ctx.beginPath();
          ctx.roundRect(obs.x, obs.y - obs.height, obs.width, obs.height, 6);
          ctx.fill();

          ctx.fillStyle = "#fef08a";
          ctx.fillRect(obs.x + 6, obs.y - obs.height + 6, obs.width - 12, 5);
        } else {
          ctx.fillStyle = "#64748b";
          ctx.fillRect(obs.x + 4, obs.y - 54, 4, 54);
          ctx.fillRect(obs.x + obs.width - 8, obs.y - 54, 4, 54);

          ctx.fillStyle = obs.color;
          ctx.beginPath();
          ctx.roundRect(obs.x, obs.y - 54, obs.width, 22, 6);
          ctx.fill();

          ctx.fillStyle = "#fde047";
          ctx.font = "bold 11px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("ডুব!", obs.x + obs.width / 2, obs.y - 39);
        }
      }
    }

    function drawCoins() {
      for (let c of coins) {
        const cy = c.y - 16;
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(c.x, cy, c.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#ca8a04";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "#854d0e";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("¢", c.x, cy + 4);
      }
    }

    function drawPlayer() {
      const box = getPlayerHitbox();
      const cx = player.x;
      const runCycle = Math.sin(frameCount * 0.35);
      const legSwing = player.isJumping ? 5 : (box.isDucking ? 2 : runCycle * 7);
      const armSwing = player.isJumping ? -5 : (box.isDucking ? 3 : -runCycle * 6);

      ctx.fillStyle = "rgba(0, 0, 0, 0.38)";
      ctx.beginPath();
      ctx.ellipse(cx, player.groundY + 4, 18, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineCap = "round";

      if (box.isDucking) {
        ctx.strokeStyle = "#1d4ed8";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - 6, player.y - 6);
        ctx.lineTo(cx - 16, player.y - 2);
        ctx.moveTo(cx + 6, player.y - 6);
        ctx.lineTo(cx + 14, player.y - 2);
        ctx.stroke();

        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.roundRect(cx - 14, player.y - 18, 28, 12, 6);
        ctx.fill();

        ctx.fillStyle = "#fcd34d";
        ctx.beginPath();
        ctx.arc(cx + 4, player.y - 21, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(cx + 4, player.y - 23, 8.5, Math.PI, 0);
        ctx.fill();
      } else {
        const footY = player.y - 1;
        const hipY = player.y - 16;
        const shoulderY = player.y - 31;
        const headY = player.y - 42;

        ctx.strokeStyle = "#1e3a8a";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - 5, hipY);
        ctx.lineTo(cx - 6 + legSwing, footY);
        ctx.moveTo(cx + 5, hipY);
        ctx.lineTo(cx + 6 - legSwing, footY);
        ctx.stroke();

        ctx.fillStyle = "#f97316";
        ctx.fillRect(cx - 9 + legSwing, footY - 3, 7, 4);
        ctx.fillRect(cx + 3 - legSwing, footY - 3, 7, 4);

        ctx.strokeStyle = "#fcd34d";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx - 11, shoulderY + 3);
        ctx.lineTo(cx - 15, shoulderY + 11 + armSwing);
        ctx.moveTo(cx + 11, shoulderY + 3);
        ctx.lineTo(cx + 15, shoulderY + 11 - armSwing);
        ctx.stroke();

        ctx.fillStyle = "#22c55e";
        ctx.beginPath();
        ctx.roundRect(cx - 11, shoulderY, 22, 17, 6);
        ctx.fill();

        ctx.fillStyle = "#fcd34d";
        ctx.beginPath();
        ctx.arc(cx, headY, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(cx - 3, headY + 1, 1.5, 0, Math.PI * 2);
        ctx.arc(cx + 3, headY + 1, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(cx, headY - 2, 9.5, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(cx - 10, headY - 3, 20, 3);
      }
    }

    function draw() {
      drawTrack();
      drawCoins();
      drawObstacles();
      drawPlayer();
    }

    function triggerGameOver() {
      isGameOver = true;
      cancelAnimationFrame(animationId);

      ctx.fillStyle = "rgba(2, 6, 23, 0.86)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#f87171";
      ctx.font = "bold 36px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("ধাক্কা লেগেছে! Game Over", canvas.width / 2, canvas.height / 2 - 28);

      ctx.fillStyle = "#f8fafc";
      ctx.font = "20px sans-serif";
      ctx.fillText("আপনার স্কোর: " + score, canvas.width / 2, canvas.height / 2 + 12);

      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 17px sans-serif";
      ctx.fillText("Enter বা বাটন চাপুন — আবার খেলতে", canvas.width / 2, canvas.height / 2 + 52);
    }

    function gameLoop() {
      if (isGameOver || isPaused) return;
      update();
      if (!isGameOver) {
        draw();
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    function bindTap(id, fn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        fn();
      });
    }

    bindTap("btnLeft", () => moveLane(-1));
    bindTap("btnRight", () => moveLane(1));
    bindTap("btnJump", () => jumpPlayer());
    bindTap("btnDuck", () => duckPlayer());
    bindTap("btnSpeedDown", () => changeSpeed(-0.2));
    bindTap("btnSpeedUp", () => changeSpeed(0.2));
    bindTap("btnPause", () => togglePause());

    let sx = 0;
    let sy = 0;

    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length > 0) {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 0) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      const th = 26;

      if (Math.abs(dx) > th || Math.abs(dy) > th) {
        if (Math.abs(dx) > Math.abs(dy)) {
          moveLane(dx > 0 ? 1 : -1);
        } else {
          if (dy < 0) jumpPlayer();
          else duckPlayer();
        }
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if (["arrowleft", "arrowright", "arrowup", "arrowdown", " ", "enter"].includes(key)) {
        e.preventDefault();
      }

      if (key === "enter" && isGameOver) {
        resetGame();
        return;
      }

      if (key === "p") {
        togglePause();
        return;
      }

      if (key === "arrowleft" || key === "a") moveLane(-1);
      else if (key === "arrowright" || key === "d") moveLane(1);
      else if (key === "arrowup" || key === "w" || key === " ") jumpPlayer();
      else if (key === "arrowdown" || key === "s") duckPlayer();
      else if (key === "+" || key === "=") changeSpeed(0.2);
      else if (key === "-" || key === "_") changeSpeed(-0.2);
    });

    initGame();
  </script>

</body>
</html>
